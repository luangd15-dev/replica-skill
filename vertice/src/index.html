<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Vértice</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span class="logo" title="Vértice"></span>
      <div id="quick"></div>
      <div id="doc-title"></div>
    </header>

    <nav id="ribbon-tabs"></nav>
    <section id="ribbon"></section>

    <main id="workspace">
      <section id="center">
        <div id="doc-tabs"></div>
        <div id="views">
          <canvas id="plan"></canvas>
          <div id="view3d" hidden></div>
          <div id="hint"></div>
        </div>
      </section>
      <div class="splitter" data-target="right"></div>
      <aside id="right" class="dock">
        <div class="dock-head"><span id="dock-title">Propriedades</span><button id="dock-close" title="Recolher painel">×</button></div>
        <div id="dock-panels">
          <div id="tree" class="panel" data-panel="edificacao" data-title="Edificação"></div>
          <div id="props" class="panel" data-panel="propriedades" data-title="Propriedades"></div>
          <div id="camadas" class="panel" data-panel="camadas" data-title="Camadas"></div>
          <div id="msgs" class="panel" data-panel="mensagens" data-title="Mensagens"><div id="log"></div></div>
        </div>
        <div id="dock-switch"></div>
      </aside>
    </main>

    <footer id="status">
      <span id="st-cmd">Comando - Selecione</span>
      <span id="st-coord" class="st-box">0,00 ; 0,00</span>
      <select id="st-escala" title="Escala da planta"></select>
      <span class="st-sep"></span>
      <span id="st-tools"></span>
      <span class="sp"></span>
      <span id="st-floor"></span>
      <span id="st-volt"></span>
    </footer>
  </div>

  <div id="menu" hidden></div>

  <div id="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span id="modal-title"></span><button id="modal-close">×</button></div>
      <div id="modal-body"></div>
      <div id="modal-foot"></div>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>

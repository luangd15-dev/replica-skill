<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Vértice</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="brand"><span class="logo"></span>Vértice</div>
      <div id="quick"></div>
      <div id="doc-title"></div>
    </header>

    <nav id="ribbon-tabs"></nav>
    <section id="ribbon"></section>

    <main id="workspace">
      <aside id="left" class="dock">
        <div class="dock-head">Projeto</div>
        <div id="tree" class="dock-body"></div>
      </aside>
      <div class="splitter" data-target="left"></div>

      <section id="center">
        <div id="view-tabs">
          <button data-view="2d" class="active">Planta 2D</button>
          <button data-view="3d">Vista 3D</button>
          <span id="floor-label"></span>
        </div>
        <div id="views">
          <canvas id="plan"></canvas>
          <div id="view3d" hidden></div>
          <div id="hint"></div>
        </div>
        <div id="console">
          <div class="dock-head">Mensagens <button id="clear-log" title="Limpar">×</button></div>
          <div id="log"></div>
        </div>
      </section>

      <div class="splitter" data-target="right"></div>
      <aside id="right" class="dock">
        <div class="dock-head">Propriedades</div>
        <div id="props" class="dock-body"></div>
      </aside>
    </main>

    <footer id="status">
      <span id="st-tool"></span>
      <span id="st-coord">X 0,00 Y 0,00</span>
      <span class="sp"></span>
      <button id="st-grid" class="toggle on">GRADE</button>
      <button id="st-snap" class="toggle on">SNAP</button>
      <button id="st-orto" class="toggle on">ORTO</button>
      <span id="st-volt"></span>
    </footer>
  </div>

  <div id="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span id="modal-title"></span><button id="modal-close">×</button></div>
      <div id="modal-body"></div>
      <div id="modal-foot"></div>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
